defaults:
  - robot: panda_franky_interface_policy 
  - cams: camera_manager
  - _self_

hydra:
  searchpath:
    - file:///home/ceylanb/robot/robot_io/robot_io/conf

output_dir: /home/ceylanb/DreMa/drema_project/input
task_name_prefix: "task_"

calibration_file: /home/ceylanb/robot/robot_io/robot_io/calibration/calibration_files/panda_realsenseD435_T_tcp_cam.npy

# "arch_parallel", "arch_skewed_clockwise", "arch_skewed_counterclockwise", "random_pose", "line_scan"
movement_type: "orbit"

movement:
  num_waypoints: 100
  flip_orientation: false
  arch_parallel:
    start_offset:  [0.0, -0.4, -0.1]  # X, Y, Z
    end_offset:    [0.0,  0.3, -0.1]  
    corner_offset: [-0.1, 0.0, 0.45]
  arch_skewed_counterclockwise:
    start_offset:  [0.1, -0.3, -0.1]  
    end_offset:    [-0.1, 0.3, -0.1]  
    corner_offset: [-0.1, 0.0, 0.45]
  arch_skewed_clockwise:
    start_offset:  [0.1, 0.3, -0.1]   
    end_offset:    [-0.1, -0.4, -0.1] 
    corner_offset: [-0.1, 0.0, 0.45]
  random_pose:
    centered: true
    # env limits
    z_limits: [0.55, 0.65]      # Z: 55cm to 65cm
    x_limits: [0.30, 0.40]      # X: 30cm to 40cm forward
    y_limits: [-0.40, 0.30]     # Y: -40cm to +30cm
    max_rotation_noise_deg: 15.0
    # centered sampler params
    centered_sampler:
      initial_pos: [0.35, 0, 0.47]
      initial_orn: ???
      # theta_limits: [-1.57, 1.57] # 180 degrees
      # theta_limits: [-3.14, 3.14] # 180 degrees
      theta_limits: [-2.35, 2.35]   # 270 degrees
      r_limits: [0.05, 0.1]
      # h_limits: [-0.05, 0.1]
      h_limits: [0., 0.08]
      trans_limits: [-0.005, 0.005]
      yaw_limits: [-0.087, 0.087]
      # pitch_limit: [-0.087, 0.087]
      pitch_limit: [0, 0.1]
      roll_limit: [-0.3, 0.3]
  line_scan:
    start_point: [0.30, -0.35, 0.60] # X, Y, Z
    end_point:   [0.30,  0.20, 0.60] # X, Y, Z
  orbit:
    center_offset: [0.0, 0.0, -0.3]   # X,Y,Z offset from initial pose
    radius: 0.15                      # Distance from center
    height: 0.3                      # Z offset (height above center)
    start_angle: -120                 # Scan start (degrees)
    end_angle: 120                    # Scan end (degrees) - Full sweep