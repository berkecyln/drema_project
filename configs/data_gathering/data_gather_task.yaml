defaults:
  - robot: panda_franky_interface_policy 
  - cams: camera_manager
  - _self_

hydra:
  searchpath:
    - file:///home/ceylanb/robot/robot_io/robot_io/conf

output_dir: /home/ceylanb/DreMa/drema_project/input
task_name_prefix: "task_"

calibration_file: /home/ceylanb/robot/robot_io/calibration/calibration_files/panda_realsenseD435_T_tcp_cam_2025_12_16__17_33.npy

movement:
  num_waypoints: 50
  flip_orientation: false
  arch_parallel:
    start_offset: [0.0, -0.4, -0.2] 
    end_offset:   [0.0,  0.3, -0.2]
    corner_offset: [-0.1, 0.0, 0.5]
  arch_skewed_counterclockwise:
    start_offset: [0.1, -0.3, -0.2]
    end_offset:   [-0.1, 0.3, -0.2]
    corner_offset: [-0.1, 0.0, 0.5]
  arch_skewed_clockwise:
    start_offset: [0.1, 0.3, -0.2]
    end_offset:   [-0.1, -0.4, -0.2]
    corner_offset: [-0.1, 0.0, 0.5]

pose_sampler:
    num_poses: 50
    # box limits
    z_limits: [0.55, 0.65]      # Z: 55cm to 65cm
    x_limits: [0.30, 0.40]      # X: 30cm to 40cm forward
    y_limits: [-0.40, 0.30]     # Y: -40cm to +30cm
    max_rotation_noise_deg: 15.0