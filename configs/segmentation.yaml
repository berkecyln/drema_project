# Segmentation pipeline configuration for DreMa dataset preparation

# Segmentation method: "grounded_sam" or "sam3"
method: "sam3"

# Input/output paths
input_dir: "input"
# Folders to process; leave empty to process all subdirectories in input_dir
folders: ["merged_20260121_174454"]
output_subdir: "object_mask"

# Debug visualization
save_debug_vis: true  # Save debug visualization images
debug_subdir: "debug_vis"  # Folder for debug images 

# Grounded SAM configuration (GroundingDINO + SAM)
grounded_sam:
  # Text prompts for object detection
  object_prompts:
    - "red cube"
    - "green cup"
    - "orange cup"
    - "yellow lego"
  
  table_prompt: "table"
  
  # Model configurations
  dino_model_id: "IDEA-Research/grounding-dino-base"
  sam_model_id: "facebook/sam-vit-huge"
  
  # Detection thresholds
  box_threshold: 0.25
  text_threshold: 0.25

# SAM 3 configuration
sam3:
  # Model configuration
  model_id: "facebook/sam3"
  
  # Text prompts for object detection
  object_prompts:
    - "red cube"
    - "green cup"
    - "orange cup"
    - "yellow lego"
  
  
  table_prompt: "surface"
  
  # Segmentation thresholds
  threshold: 0.5  # Instance detection
  mask_threshold: 0.5  # Mask binarization

device: null
background_id: 255  # Background pixel value

num_workers: 1  # Set > 1 for multi-process batch processing
