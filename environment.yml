name: drema_env
channels:
  - pytorch-nightly
  - nvidia/label/cuda-12.8.0
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - wheel
  - cuda-toolkit=12.8
  - gcc_linux-64=11
  - gxx_linux-64=11
  - make
  - cmake
  - ninja
  - glm
  - sysroot_linux-64=2.17
  - pip:
      - --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cu128
      - "numpy<2.0"
      - opencv-python
      - open3d
      - matplotlib
      - object2urdf
      - trimesh==3.10
      - pybullet
      - mediapy
      - plyfile
      - setuptools==49.4
      - hydra-core>=1.3.2
      - pynput
      - scipy==1.10.1