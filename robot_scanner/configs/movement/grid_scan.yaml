type: grid_scan
num_waypoints_per_pass: 60   # 3x3x60 = 540 total frames

grid_scan:
  # X = depth toward drawer (robot base frame, meters)
  # Max safe X ≈ 0.38  (drawer at 0.50, gripper adds ~0.10m physical length)
  x_positions: [0.25, 0.32, 0.38]

  # Z = height above robot base (meters)
  # Listed high-to-low — code sorts descending so high passes run first
  z_heights: [0.67, 0.57, 0.48]

  # Y = lateral sweep — 3cm margin inside table edges (35cm left, 45cm right)
  y_start: -0.32
  y_end:    0.42

  # Z offset applied to the neutral TCP position to get the scene center.
  # Neutral pose XY is used directly as the look-at center (same as arch).
  # Negative = look downward toward table. Match arch's start_offset Z = -0.1.
  scene_center_z_offset: -0.1
