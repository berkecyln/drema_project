type: random_pose
num_waypoints: 300

random_pose:
  centered: true
  x_limits: [0.30, 0.40]
  y_limits: [-0.40, 0.30]
  z_limits: [0.55, 0.65]
  max_rotation_noise_deg: 15.0
  centered_sampler:
    initial_pos: [0.35, 0, 0.47]
    theta_limits: [-2.35, 2.35]
    r_limits: [0.05, 0.1]
    h_limits: [0., 0.08]
    trans_limits: [-0.005, 0.005]
    yaw_limits: [-0.087, 0.087]
    pitch_limit: [0, 0.1]
    roll_limit: [-0.3, 0.3]
